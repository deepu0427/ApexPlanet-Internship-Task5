<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced E-Commerce</title>

<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body {background:#f4f4f4; transition:0.3s;}
.dark {background:#121212;color:white;}

header {
    background:#222;color:white;padding:15px;
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;
}

button {cursor:pointer}

/* PRODUCTS */
.container {padding:20px;}

.products {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card {
    background:white;padding:10px;border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.dark .card {background:#1e1e1e;}

.card img {width:100%; height:150px; object-fit:cover;}

.card button {
    background:green;color:white;border:none;
    width:100%;padding:8px;margin-top:5px;
}

/* CART */
.cart {
    position:fixed; right:0; top:0;
    width:300px;height:100%;
    background:white;padding:15px;
    overflow:auto;
}
.dark .cart {background:#1e1e1e;}

.cart-item {margin-bottom:10px}

/* LOGIN */
.modal {
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    display:flex;justify-content:center;align-items:center;
}

.modal-box {
    background:white;padding:20px;border-radius:10px;
}

input {padding:8px;margin:5px 0;width:100%;}

/* MOBILE */
@media(max-width:768px){
    .cart {width:100%;}
}
</style>
</head>

<body>

<header>
    <h2>MyShop</h2>

    <input type="text" id="search" placeholder="Search...">

    <select id="filter">
        <option value="all">All</option>
        <option value="fashion">Fashion</option>
        <option value="electronics">Electronics</option>
    </select>

    <button onclick="toggleDark()">🌙</button>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">
    <div class="products" id="products"></div>
</div>

<div class="cart">
    <h3>Cart</h3>
    <div id="cart"></div>
    <h4>Total: ₹<span id="total">0</span></h4>
    <button onclick="checkout()">Checkout</button>
</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
    <div class="modal-box">
        <h3>Login / Signup</h3>
        <input type="text" id="username" placeholder="Enter Username">
        <button onclick="login()">Login</button>
    </div>
</div>

<script>

// ===== PRODUCTS =====
const products = [
 {id:1,name:"Shoes",price:1000,cat:"fashion",img:"images/shoes.webp"},
 {id:2,name:"T-Shirt",price:500,cat:"fashion",img:"images/Tshirt.jpg"},
 {id:3,name:"Headphones",price:2000,cat:"electronics",img:"images/headphone.webp"},
 {id:4,name:"Watch",price:1500,cat:"electronics",img:"images/watch.jpg"}
];

// ===== STATE =====
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// ===== LOGIN =====
// ===== LOGIN =====
function login(){
    const name = document.getElementById("username").value.trim();
    if(name){
        localStorage.setItem("user", name);
        document.getElementById("loginModal").style.display = "none";
        alert("Welcome, " + name + "!");
    } else {
        alert("Please enter a valid username.");
    }
}

function logout(){
    localStorage.removeItem("user");
    // Show login modal again immediately after logout
    document.getElementById("loginModal").style.display = "flex";
}

// ===== INIT =====
let user = localStorage.getItem("user");
if(user){
    // Hide modal only if user is logged in
    document.getElementById("loginModal").style.display = "none";
} else {
    // Always show modal on first load
    document.getElementById("loginModal").style.display = "flex";
}



// ===== DISPLAY PRODUCTS =====
function showProducts(list){
    const div = document.getElementById("products");
    div.innerHTML="";

    list.forEach(p=>{
        div.innerHTML += `
        <div class="card">
            <img src="${p.img}" loading="lazy">
            <h4>${p.name}</h4>
            <p>₹${p.price}</p>
            <button onclick="addCart(${p.id})">Add</button>
        </div>`;
    });
}

// ===== CART =====
function addCart(id){
    const item = cart.find(i=>i.id===id);
    if(item){
        item.qty++;
    } else {
        const prod = products.find(p=>p.id===id);
        cart.push({...prod, qty:1});
    }
    saveCart();
}

function removeCart(id){
    cart = cart.filter(i=>i.id!==id);
    saveCart();
}

function saveCart(){
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function renderCart(){
    const div = document.getElementById("cart");
    let total=0;
    div.innerHTML="";

    cart.forEach(item=>{
        total += item.price * item.qty;
        div.innerHTML += `
        <div class="cart-item">
            ${item.name} (${item.qty}) - ₹${item.price*item.qty}
            <button onclick="removeCart(${item.id})">❌</button>
        </div>`;
    });

    document.getElementById("total").innerText = total;
}

// ===== SEARCH =====
document.getElementById("search").addEventListener("input", function(){
    filterProducts();
});

// ===== FILTER =====
document.getElementById("filter").addEventListener("change", filterProducts);

function filterProducts(){
    let text = search.value.toLowerCase();
    let cat = filter.value;

    let filtered = products.filter(p=>{
        return (cat==="all" || p.cat===cat) &&
               p.name.toLowerCase().includes(text);
    });

    showProducts(filtered);
}

// ===== DARK MODE =====
function toggleDark(){
    document.body.classList.toggle("dark");
}

// ===== CHECKOUT =====
function checkout(){
    if(cart.length===0){
        alert("Cart is empty!");
        return;
    }
    alert("Order placed successfully!");
    cart=[];
    saveCart();
}

// ===== INIT =====
showProducts(products);
renderCart();

</script>

</body>
</html>
